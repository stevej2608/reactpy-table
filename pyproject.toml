[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

##############################
# >>> Hatch Build Config <<< #
##############################

[project]
name = "reactpy_table"
description = "Headless UI for building powerful tables"
readme = "README.md"
keywords = ["React", "ReactPy", "table", "headless-ui"]
license = "MIT"
authors = [{ name = "Steve Jones", email = "jonesst2608@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Widget Sets",
  "Topic :: Software Development :: User Interfaces",
  "Environment :: Web Environment",
  "Typing :: Typed",
]
dependencies = ["reactpy==2.0.0b4"]
dynamic = ["version"]
urls.Homepage = "https://github.com/stevej2608/reactpy-table/blob/master/README.md"
urls.Repository = "https://github.com/stevej2608/reactpy-table"
urls.Source = "https://github.com/stevej2608/reactpy-table"

[tool.hatch.version]
path = "reactpy_table/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/reactpy_table"]

[tool.hatch.build.targets.wheel]
packages = ["reactpy_table"]

[tool.hatch.metadata]
license-files = { paths = ["LICENSE"] }

[tool.hatch.envs.default]
installer = "uv"

#############################
# >>> Hatch Test Runner <<< #
#############################

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "pytest-timeout==2.2.0",
  "fastapi>=0.109.0",
  "playwright==1.41.1",
  "pytest>=7.4.4",
  "pytest-asyncio>=0.23.3",
  "starlette>=0.13.6",
  "trio>=0.24.0",
  "uvicorn[standard]>=0.19.0",
  "faker>=24.3.0",
  "sqlmodel>=0.0.16",
]
randomize = true
matrix-name-format = "{variable}-{value}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12"]

################################
# >>> Hatch Python Scripts <<< #
################################

[tool.hatch.envs.python]
extra-dependencies = ["pyright"]

[tool.hatch.envs.python.scripts]
type_check = ["pyright reactpy_table"]

#########################
# >>> Generic Tools <<< #
#########################

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
# https://marketplace.visualstudio.com/items?itemName=charliermarsh.ruff
line-length = 120

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#sample-pyprojecttoml-file
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = "tests"
log_cli_level = "INFO"
filterwarnings = "ignore::DeprecationWarning"

# -r Show extra test summary info as specified by chars:
#   (s)kipped,
#   (x)failed,
#   (X)passed,
# addopts = "-rsxX"

# asyncio_mode = "auto"
