[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

##############################
# >>> Hatch Build Config <<< #
##############################

[project]
name = "reactpy-table"
description = "Table library for ReactPy"
readme = "README.md"
keywords = ["React", "ReactJS", "ReactPy", "forms", "components"]
license = "MIT"
authors = [{ name = "Steve Jones", email = "jonesst2608@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["reactpy==2.0.0b7"]
dynamic = ["version"]
urls.Homepage = "https://github.com/stevej2608/reactpy-table"
urls.Source = "https://github.com/stevej2608/reactpy-table"

[tool.hatch.version]
path = "src/reactpy_table/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/utils"]

[tool.hatch.build.targets.wheel]
packages = ["src/reactpy_table"]

[tool.hatch.metadata]
license-files = { paths = ["LICENSE"] }

[tool.hatch.envs.default]
installer = "uv"

#############################
# >>> Hatch Test Runner <<< #
#############################

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "asgi-tools",
  "asgiref",
  "exceptiongroup",
  "faker>=24.3.0",
  "orjson",
  "playwright",
  "pydantic>=2.5.3",
  "pyright",
  "pytest-asyncio",
  "pytest-sugar",
  "servestatic",
  "sqlmodel>=0.0.16",
  "uvicorn[standard]",
]
randomize = true
matrix-name-format = "{variable}-{value}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.pytest.ini_options]
testpaths = "tests"
log_cli_level = "INFO"
filterwarnings = "ignore::DeprecationWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

################################
# >>> Hatch Python Scripts <<< #
################################

[tool.hatch.envs.python]
extra-dependencies = ["pyright"]

[tool.hatch.envs.python.scripts]
type_check = ["pyright reactpy_table"]

[tool.hatch.envs.javascript]
detached = true
#########################
# >>> Generic Tools <<< #
#########################

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
# https://marketplace.visualstudio.com/items?itemName=charliermarsh.ruff

line-length = 120

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#sample-pyprojecttoml-file
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
ignore = ["tmp", "tmp/**", "**/tmp/**"]



